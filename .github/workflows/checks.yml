name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            miniapp/package-lock.json
            admin/package-lock.json
      - run: npm ci
      - run: npm ci --prefix miniapp
      - run: npm ci --prefix admin
      - run: node scripts/verify-project.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-ui.mjs
      - run: node scripts/check-tryon-history.mjs
